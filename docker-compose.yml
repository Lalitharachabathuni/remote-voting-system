version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: voteremote-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voteremote-backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/voteremote
      - CLIENT_URL=http://localhost:3000
      - JWT_ACCESS_SECRET=voteremote_super_secure_access_secret_key_2026_9981273918237912
      - JWT_REFRESH_SECRET=voteremote_super_secure_refresh_secret_key_2026_1289371289371892
      - VOTER_REF_HMAC_SECRET=voteremote_anonymization_hmac_secret_key_7781293719827391
      - BALLOT_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    ports:
      - "5000:5000"
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voteremote-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
